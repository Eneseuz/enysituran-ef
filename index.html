const M=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.85},o));
function box(w,h,d,x,y,z,mat,col){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);scene.add(m);

function cyl(r,h,x,y,z,mat,rt){const m=new T.Mesh(new T.CylinderGeometry(rt??r,r,h,20),mat);m.position.set(x,y,z);scene.add(m);return m}
function cv(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c}
function tex(c,rx,ry){const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=4;return t}
function label(txt,x,y,z,s=1,color='#fff'){const c=cv(512,128,(g,w,h)=>{g.fillStyle='rgba(0,0,0,.65)';g.fillRect(0,0,w,h);g.fillStyle=color;g.font='bold 56px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,w/2,h/2)});
 const sp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true}));sp.position.set(x,y,z);sp.scale.set(2*s,.5*s,1);scene.add(sp)}

function logoCanvas(){return cv(256,256,(g)=>{g.fillStyle='#3a1c14';g.beginPath();g.arc(128,128,126,0,7);g.fill();g.strokeStyle='#e8c07a';g.lineWidth=6;g.beginPath();g.arc(128,128,112,0,7);g.stroke();

const logoTex=new T.CanvasTexture(logoCanvas());
if(LOGO_URL){const im=new Image();im.onload=()=>{const c=cv(512,512,g=>{g.fillStyle='#1a0e0b';g.beginPath();g.arc(256,256,256,0,7);g.fill();g.save();g.beginPath();g.arc(256,256,248,0,7);g.clip();g.drawImage(im,34,34,444,444);g.restore();g.strokeStyle='#e8c07a';g.lineWidth=8;g.beginPath();g.arc(256,256,252,0,7);g.stroke()});logoTex.image=c;logoTex.needsUpdate=true};im.src=LOGO_URL}

function walk(n,tx,tz,dt,sp){const dx=tx-n.g.position.x,dz=tz-n.g.position.z,d=Math.hypot(dx,dz);if(d<.08)return true;const s=Math.min(d,sp*dt);n.g.position.x+=dx/d*s;n.g.position.z+=dz/d*s;const a=Math.atan2(dx,dz);let da=a-n.g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));n.g.rotation.y+=da*Math.min(1,dt*8);n.ph+=dt*sp*5;const sw=Math.sin(n.ph)*.6;n.legL.rotation.x=sw;n.legR.rotation.x=-sw;n.aL.rotation.x=-sw*.7;n.aR.rotation.x=(n.tray&&n.tray.visible)?-1.4:sw*.7;return false}
function stand(n){n.legL.rotation.x=n.legR.rotation.x=0;n.kL.rotation.x=n.kR.rotation.x=0;n.aL.rotation.x=0;if(!(n.tray&&n.tray.visible))n.aR.rotation.x=0}
function follow(n,dt,sp){if(!n.path.length){stand(n);return true}const p=n.path[0];if(walk(n,p[0],p[1],dt,sp))n.path.shift();return false}
